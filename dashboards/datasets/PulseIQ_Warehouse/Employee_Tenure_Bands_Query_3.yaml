table_name: Employee Tenure Bands Query
main_dttm_col: null
description: null
default_endpoint: null
offset: 0
cache_timeout: null
catalog: pulseiq
schema: dw
sql: "SELECT\r\n    CASE\r\n        WHEN hire_date >= CURRENT_DATE - INTERVAL '1 year'\r\
  \n            THEN 'Less than 1 Year'\r\n        WHEN hire_date >= CURRENT_DATE\
  \ - INTERVAL '3 years'\r\n            THEN '1\u20133 Years'\r\n        WHEN hire_date\
  \ >= CURRENT_DATE - INTERVAL '5 years'\r\n            THEN '3\u20135 Years'\r\n\
  \        ELSE '5+ Years'\r\n    END AS tenure_band,\r\n    COUNT(*) AS employee_count\r\
  \nFROM dw.dim_employee\r\nGROUP BY 1\r\nORDER BY 1;"
